name: notebooks

# Re-executes notebooks on a clean machine. The point is not to test the models,
# it is to catch the two ways a notebook collection quietly dies: a cell that only
# ran because of leftover kernel state, and a dependency that moved underneath it.
#
# Outputs are not committed back. The committed outputs are the ones I read and
# published; CI only has to prove the notebook still runs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly, so a broken dependency surfaces before someone else finds it.
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    # 86 notebooks, executed one after another. Several take minutes on their own,
    # so the old 45 was a limit set when the book was half this size.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only; the GPU build is not needed to prove a notebook runs.
          # Both torch and torchvision have to come from the CPU index, and at the
          # pinned versions. Installing an unpinned torch here and then running
          # requirements.txt afterwards pulled the 2.5 GB CUDA build straight back
          # over the top of it, because the pin resolves against the default index.
          pip install torch==2.11.0 torchvision==0.26.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Health check
        # Catches the failure modes that have actually happened here: a notebook
        # committed mid-run with empty outputs, a cell that errored, a README
        # pointing at a figure that does not exist, and the prose rules in STYLE.md.
        run: python tools/healthcheck.py

      - name: Check every dataset in use is declared
        run: |
          python - <<'PY'
          import pathlib, sys
          root = pathlib.Path(".")
          declared = (root / "data" / "README.md").read_text(encoding="utf-8")
          missing = [d.name for d in (root / "data" / "raw").iterdir()
                     if d.is_dir() and d.name not in declared]
          if missing:
              sys.exit(f"datasets present but not declared in data/README.md: {missing}")
          print("every dataset under data/raw is declared")
          PY

      - name: Execute notebooks
        run: |
          shopt -s globstar nullglob
          failed=0
          for nb in **/notebook.ipynb; do
            echo "::group::$nb"
            if ! (cd "$(dirname "$nb")" && \
                  jupyter nbconvert --to notebook --execute --inplace \
                    --ExecutePreprocessor.timeout=1200 notebook.ipynb); then
              echo "::error file=$nb::failed to execute"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Confirm nothing was left uncommitted
        if: always()
        run: |
          git checkout -- . || true
          git status --short
